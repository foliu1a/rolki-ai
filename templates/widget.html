<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/static/rolki.png">
<title>Rolki AI – widget</title>
<style>
  /* ta sama paleta co panel: neutralny grafit, jeden stonowany akcent (fiolet), zielony = ok, czerwony = źle, bursztyn = uwaga */
  :root { --tlo: #0f1115; --karta: #171a21; --linia: #262b36; --tekst: #e7e9ef; --szary: #9aa3b2;
          --akcent: #8b7cf6; --akcent-jasny: #a79dff; --ok: #45c97a; --uwaga: #e8b04f; --zle: #f0647e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--tlo); color: var(--tekst); font: 13px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; height: 100%; }
  body { padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 300px; }
  .gora { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .gora b { font-size: 14px; display: inline-flex; align-items: center; gap: 7px; }
  .gora b img { width: 18px; height: 18px; border-radius: 5px; }
  .gora a { color: var(--szary); text-decoration: none; font-size: 12px; }
  .gora a:hover { color: var(--akcent-jasny); }
  .saldo { display: flex; align-items: baseline; gap: 8px; }
  .saldo .liczba { font-size: 34px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
  .saldo .liczba.uwaga { color: var(--uwaga); } .saldo .liczba.zle { color: var(--zle); }
  .saldo small { color: var(--szary); }
  .pasek { height: 6px; background: var(--karta); border: 1px solid var(--linia); border-radius: 4px; overflow: hidden; }
  .pasek > div { height: 100%; width: 0; background: var(--akcent); transition: width .4s; }
  .pasek > div.uwaga { background: var(--uwaga); } .pasek > div.zle { background: var(--zle); }
  .dzis { display: flex; justify-content: space-between; color: var(--szary); font-size: 12px; margin-top: 4px; }
  .kafle { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .kafel { background: var(--karta); border: 1px solid var(--linia); border-radius: 8px; padding: 8px 6px; text-align: center; }
  .kafel .n { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .kafel .e { font-size: 11px; color: var(--szary); }
  .kafel.zle .n { color: var(--zle); } .kafel.ok .n { color: var(--ok); }
  .stopka { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--szary); min-height: 18px; }
  .kropka { width: 8px; height: 8px; border-radius: 50%; background: var(--szary); flex: none; }
  .kropka.on { background: var(--ok); } .kropka.praca { background: var(--akcent); }
  .ostatni { color: var(--szary); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ostatni.blad { color: var(--zle); } .ostatni.ok { color: var(--ok); }
  .blad-polaczenia { color: var(--zle); font-size: 12px; }
  .hamulec { color: var(--zle); font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="gora"><b><img src="/static/rolki.png" alt=""><span id="persona">Rolki AI</span></b><a href="/" target="_blank" rel="noopener">otwórz panel →</a></div>
  <div class="blad-polaczenia" id="offline" hidden>Panel nie odpowiada — uruchom go skrótem Rolki AI</div>
  <div>
    <div class="saldo"><span class="liczba" id="saldo">—</span><small id="saldo-etykieta">kr Higgsfield</small></div>
    <div class="pasek" style="margin-top:8px"><div id="pasek"></div></div>
    <div class="dzis"><span id="dzis">dziś —</span><span id="rolki">rolki dziś —</span></div>
  </div>
  <div class="kafle">
    <div class="kafel"><div class="n" id="k-nowy">–</div><div class="e">do zrobienia</div></div>
    <div class="kafel ok"><div class="n" id="k-gotowe">–</div><div class="e">gotowe</div></div>
    <div class="kafel zle"><div class="n" id="k-blad">–</div><div class="e">błędy</div></div>
  </div>
  <div class="stopka"><span class="kropka" id="kropka"></span><span id="autopilot">autopilot —</span></div>
  <div class="hamulec" id="hamulec" hidden></div>
  <div class="ostatni" id="ostatni"></div>
<script>
const $ = s => document.querySelector(s);
function odstep(sek) { if (sek == null) return ''; const m = Math.max(0, Math.round(sek / 60)); return m < 1 ? 'za chwilę' : `za ${m} min`; }
async function odswiez() {
  let d;
  try { d = await (await fetch('/api/stan')).json(); } catch (e) { $('#offline').hidden = false; return; }
  $('#offline').hidden = true;
  if (!d.ok) return;
  const s = d.stan, hf = (d.saldo || {}).higgsfield || {};
  $('#persona').textContent = s ? `Rolki AI · ${s.modelka}` : 'Rolki AI · brak persony';
  const dost = s ? s.dostawca : 'higgsfield';
  const ws = dost === 'wavespeed';             // WaveSpeed: centy USD -> dolary
  const usd = c => '$' + (Number(c || 0) / 100).toFixed(2).replace('.', ',');
  const saldo = (dost === 'yapper' || ws) ? ((d.saldo || {})[dost] || {}) : hf;
  $('#saldo-etykieta').textContent = ws ? 'WaveSpeed' : (dost === 'yapper' ? 'kr yapper' : 'kr Higgsfield');
  const liczba = $('#saldo');
  liczba.textContent = saldo.kredyty == null ? '—' : (ws ? usd(saldo.kredyty) : saldo.kredyty.toLocaleString('pl-PL'));
  liczba.className = 'liczba';
  if (s) {
    const b = s.budzet;
    if (saldo.kredyty != null && saldo.kredyty < b.min_kredyty) liczba.classList.add('zle');
    else if (saldo.kredyty != null && saldo.kredyty < b.min_kredyty + b.max_kredyty_na_rolke) liczba.classList.add('uwaga');
    const proc = b.limit_dzienny ? Math.min(100, Math.round(100 * b.wydano_dzis / b.limit_dzienny)) : 0;
    const pasek = $('#pasek'); pasek.style.width = proc + '%';
    pasek.className = proc >= 100 ? 'zle' : (proc >= 80 ? 'uwaga' : '');
    $('#dzis').textContent = ws ? `dziś ${usd(b.wydano_dzis)}${b.limit_dzienny ? '/' + usd(b.limit_dzienny) : ' (brak limitu!)'}`
      : `dziś ${b.wydano_dzis}${b.limit_dzienny ? '/' + b.limit_dzienny : ''} kr`;
    $('#rolki').textContent = `rolki dziś ${b.rolki_dzis}${b.max_rolek_dziennie ? '/' + b.max_rolek_dziennie : ''}`;
    const st = s.statystyki || {};
    $('#k-nowy').textContent = st.nowy ?? 0; $('#k-gotowe').textContent = st.gotowe ?? 0; $('#k-blad').textContent = st.blad ?? 0;
  }
  const a = d.autopilot || {}, z = d.zadanie || {};
  const kropka = $('#kropka'); kropka.className = 'kropka' + (z.trwa ? ' praca' : (a.wlaczony ? ' on' : ''));
  $('#autopilot').textContent = z.trwa ? `pracuje: ${z.typ}${z.modelka ? ' · ' + z.modelka : ''}`
    : a.wlaczony ? `autopilot włączony${a.nastepny ? ' · ' + odstep(a.nastepny - Date.now() / 1000) : ''}` : 'autopilot wyłączony';
  const o = d.dziennik_ostatni;
  const el = $('#ostatni'); el.textContent = o ? o.tekst : ''; el.className = 'ostatni ' + (o ? o.typ : '');
  // hamulec: autopilot zatrzymał się (np. kilka nieudanych rolek z rzędu) – czeka na „Wznów” w panelu
  const ap = d.autopilot_stan || {}, h = $('#hamulec');
  h.hidden = !ap.pauza; h.textContent = ap.pauza ? `STOP: ${ap.pauza}` : ''; h.title = ap.pauza ? 'Autopilot zatrzymany – kliknij Wznów w panelu' : '';
}
odswiez();
setInterval(odswiez, 10000);
</script>
</body>
</html>
